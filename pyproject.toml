[project]
name = "reports"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "tabulate>=0.9.0",
]

[project.scripts]
reports = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reports"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]